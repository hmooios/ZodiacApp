
name: ZodiacApp iOS CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  inspect:
    name: Inspect CI Environment
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect installed Xcode versions
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/*.app | grep Xcode || true

          echo "Selected Developer Directory:"
          xcode-select -p

          echo "Selected Xcode version:"
          xcodebuild -version

      - name: Inspect project format
        run: |
          grep "objectVersion" ZodiacApp.xcodeproj/project.pbxproj

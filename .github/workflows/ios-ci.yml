
name: ZodiacApp iOS CI

on:
  push:
    branches:
      - master
      - 'feature/**'

  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build ZodiacApp
    runs-on: xcode-27
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build ZodiacApp
        run: |
          xcodebuild \
            -project ZodiacApp.xcodeproj \
            -scheme ZodiacApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
